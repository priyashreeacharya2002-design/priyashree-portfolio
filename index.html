<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priyashree Acharya</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
    }

    .name {
      font-family: 'Georgia', serif;
      font-weight: 400;
      font-size: clamp(13px, 1.5vw, 16px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 48px;
    }

    .message {
      font-family: 'Georgia', serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 58px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .message em {
      font-style: italic;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="name">Priyashree Acharya</p>
    <h1 class="message">This site is taking shape.<br><em>Coming soon.</em></h1>
  </div>
</body>
</html>
